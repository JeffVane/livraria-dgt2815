<main class="container">
  <h1>Lista de Livros</h1>
  <table class="tabela">
    <thead>
      <tr>
        <th>Título</th>
        <th>Resumo</th>
        <th>Editora</th>
        <th>Autores</th>
        <th>Excluir</th>
      </tr>
    </thead>
    <tbody>
      @for (livro of livros; track livro.codigo) {
        <tr>
          <td>{{ livro.titulo }}</td>
          <td>{{ livro.resumo }}</td>
          <td>{{ livro.codEditora }}</td>
          <td>{{ livro.autores.join(', ') }}</td>
          <td>
            <button (click)="excluir(livro.codigo)">Excluir</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</main>
